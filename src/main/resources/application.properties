# --- Aplicação ---
quarkus.application.name=auditoria-parcelamento
quarkus.http.port=8080

# --- Banco (perfil dev: Postgres do docker-compose; perfil test: Dev Services/Testcontainers) ---
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/auditoria
%dev.quarkus.datasource.username=auditoria
%dev.quarkus.datasource.password=auditoria

%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/auditoria
%prod.quarkus.datasource.username=auditoria
%prod.quarkus.datasource.password=auditoria

# --- Logs do pacote de modelo (demonstração do enum TipoParcelamento) ---
quarkus.log.category."br.com.auditoria.parcelamento.model".level=DEBUG

# --- Auditoria no Loki (push HTTP assíncrono) ---
# Em testes o push fica desligado (não há Loki subindo nos testes).
audit.loki.enabled=true
audit.loki.url=http://localhost:3100
audit.loki.job=auditoria
audit.loki.app=pedido-parcelamento

%test.audit.loki.enabled=false

# --- Auditoria de request/response HTTP ---
# Loki recebe TODAS as chamadas (job separado: auditoria-http);
# o Postgres guarda apenas erros (status >= error-min-status).
audit.http.enabled=true
audit.http.job=auditoria-http
audit.http.max-body-chars=4096
audit.http.log-success-response-body=false
audit.http.persist-errors=true
audit.http.error-min-status=500

# Em testes o limiar baixa para 400, permitindo exercitar a persistência de erros
%test.audit.http.error-min-status=400
